apiVersion: apps/v1
kind: Deployment
metadata:
  name: peniafiel
  namespace: default
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: peniafiel
  template:
    metadata:
      labels:
        app: peniafiel
    spec:
      containers:
      - name: peniafiel
        image: your-registry/peniafiel:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: web
        env:
        - name: MONGO_URI
          value: "mongodb://root:$MONGO_ROOT_PASSWORD@mongodb:27017/Biblioteca?authSource=admin"
        - name: MONGO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: MONGO_ROOT_PASSWORD
        - name: FLASK_ENV
          value: "production"
        - name: FLASK_APP
          value: "app.py"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
